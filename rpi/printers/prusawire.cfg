# PrusaWire CoreXZ with BTT SKR Mini E3 V3 and LDO Nitehawk-SB
# https://github.com/bigtreetech/BIGTREETECH-SKR-mini-E3/blob/master/firmware/V3.0/Klipper/SKR%20Mini%20E3%20V3.0%20klipper.cfg
-- printer.cfg
[mcu]
# this has to be changed after installation, you can find it with `ls /dev/serial/by-id/usb-Klipper_stm32g0b1xx*`
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3200180002504E5238363120-if00
restart_method: command

[mcu nitehawk]
# this has to be changed after installation, you can find it with `ls /dev/serial/by-id/usb-Klipper_stm32g0b1xx*`
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1E004F000351353032333039-if00
restart_method: command

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[gcode_arcs]
resolution: 1.0

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor host_temp]
sensor_type: temperature_host
min_temp: 10
max_temp: 90

# X = A/XZ motor (XM), Y = bed (YM), Z = B/XZ motor (ZAM)
[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -4
position_endstop: -4
position_max: 250
homing_speed: 40
homing_retract_dist: 20
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
interpolate: True
run_current: 0.35
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PC0
driver_SGTHRS: 130

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -33
position_endstop: -33
position_max: 210
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
interpolate: True
run_current: 0.35
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PC1
driver_SGTHRS: 135

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
position_max: 183
position_min: -5
homing_speed: 35
second_homing_speed: 10
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
interpolate: True
run_current: 0.35
sense_resistor: 0.110
stealthchop_threshold: 0

[extruder]
step_pin: nitehawk:PB8
dir_pin: nitehawk:PB9
enable_pin: !nitehawk:PC14
microsteps: 16
rotation_distance: 47.088
gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: nitehawk:PA7
sensor_type: Generic 3950
sensor_pin: nitehawk:PB12
pullup_resistor: 2200
control: pid
pid_Kp: 18.035
pid_Ki: 2.061
pid_Kd: 39.451
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 150.0
max_extrude_cross_section: 999

[tmc2209 extruder]
uart_pin: nitehawk:PB7
tx_pin: nitehawk:PB6
sense_resistor: 0.100
interpolate: false
run_current: 0.6
stealthchop_threshold: 0

[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC4
control: pid
pid_Kp: 57.285
pid_Ki: 1.078
pid_Kd: 761.173
max_power: 1.0
min_temp: 0
max_temp: 120

[fan]
pin: nitehawk:PA15
kick_start_time: 0.5
min_power: 0.10

[heater_fan hotend_fan]
pin: nitehawk:PD0
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[heater_fan controller_fan]
pin: PB15
heater: heater_bed
heater_temp: 45.0
kick_start_time: 0.5

[printer]
kinematics: corexz
max_velocity: 300
max_accel: 2000
max_z_velocity: 300
max_z_accel: 2000
square_corner_velocity: 12.0

[neopixel sb_leds]
pin: nitehawk:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.4
initial_WHITE: 0.0

[output_pin nitehawk_act_led]
pin: !nitehawk:PC6

[adxl345]
cs_pin: nitehawk:PB10
spi_software_sclk_pin: nitehawk:PA5
spi_software_mosi_pin: nitehawk:PA2
spi_software_miso_pin: nitehawk:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
probe_points:
    125, 105, 20

-- microprobe.cfg
[probe]
pin: ^!nitehawk:PC15
x_offset: -1.8
y_offset: 19.75

[bed_mesh]
mesh_min: 40,20
mesh_max: 210,190
probe_count: 7,7

[screws_tilt_adjust]
__action__: DELETED

[axis_twist_compensation]
calibrate_start_x: 40
calibrate_end_x: 210
calibrate_y: 111

[output_pin probe_enable]
pin: nitehawk:PB4
