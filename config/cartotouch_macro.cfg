[gcode_macro _CARTOGRAPHER_TOUCH]
variable_stop_start_camera: False
gcode:
  {% set camera_started = printer["gcode_macro START_CAMERA"].started|default(true) %}
  {% if stop_start_camera and camera_started %}
    SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=camera_stopped VALUE=True
    STOP_CAMERA
  {% endif %}

  # touch samples and retries are configured in cartotouch.cfg
  CARTOGRAPHER_TOUCH

  {% if stop_start_camera and camera_started %}
    SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=camera_stopped VALUE=False
    START_CAMERA
  {% endif %}


[gcode_macro _PROBE_AF_BM_SP_HOME_Z]
gcode:
  {% set cartotouch = ('scanner' in printer.configfile.settings and 'touch' == printer.configfile.settings['scanner'].mode|default('touch')) %}
  {% if cartotouch %}
    {% set preheat_nozzle_temp = printer["gcode_macro _START_END_PARAMS"].start_preheat_nozzle_temp %}
    M109 S{preheat_nozzle_temp} # wait for nozzle temp

    # flag that touch phase is starting
    SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=touch_started VALUE=True

    {% set BED_TEMP=params.BED_TEMP|default(65)|float %}
    {% set EXTRUDER_TEMP=params.EXTRUDER_TEMP|default(230)|float %}

    {% set stop_heaters_for_touch = printer["gcode_macro _START_END_PARAMS"].stop_heaters_for_touch %}
    {% if stop_heaters_for_touch %}
      _START_PRINT_TOUCH_STATE BED_TARGET={BED_TEMP} EXTRUDER_TARGET={preheat_nozzle_temp}
      RESPOND TYPE=command MSG='Stopping heaters before touch ...'
      M104 S0
      M140 S0
    {% endif %}

    _CARTOGRAPHER_TOUCH

    # flag that touch phase is ending
    SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=touch_started VALUE=False

    {% if stop_heaters_for_touch %}
      RESPOND TYPE=command MSG='Starting heaters after touch ...'
      {% set after_touch_wait_for_bed = printer["gcode_macro _START_END_PARAMS"].after_touch_wait_for_bed %}
      {% if after_touch_wait_for_bed %}
        M104 S{preheat_nozzle_temp} # start nozzle heating back up to at least nozzle temp

        {% set start_print_bed_heating_move_bed_distance = printer["gcode_macro _START_END_PARAMS"].start_print_bed_heating_move_bed_distance %}
        {% if start_print_bed_heating_move_bed_distance > 0 %}
          G0 Z{start_print_bed_heating_move_bed_distance} F1200
        {% endif %}
        M190 S{BED_TEMP} # wait for bed to get back up to temp
        M104 S{EXTRUDER_TEMP} # we can now start heating nozzle to final temp
      {% else %}
        M140 S{BED_TEMP} # start heating bed up to temp
        M104 S{EXTRUDER_TEMP} # we can now start heating nozzle to final temp
        M190 S{BED_TEMP} # wait for bed to get back up to temp
      {% endif %}
    {% endif %}
  {% endif %}


[gcode_macro CARTOGRAPHER_THRESHOLD_SCAN]
rename_existing: _CARTOGRAPHER_THRESHOLD_SCAN
gcode:
  {% set verify_firmware = printer["gcode_macro _CARTOTOUCH_VARIABLES"].verify_firmware %}
  {% set mcu_version = printer['mcu scanner'].mcu_version|default('') %}
  {% if verify_firmware and 'K1' not in mcu_version and 'Lite' not in mcu_version %}
    RESPOND TYPE=error MSG="Threshold scan aborted: You must flash the cartographer with K1 specific firmware!"
    RESPOND TYPE=error MSG="See https://pellcorp.github.io/creality-wiki/invalid-cartotouch-firmware"
  {% else %}
    {% set mode = printer.configfile.settings["scanner"].mode|default('scan') %}
    {% if mode == 'touch' %}
        _CARTOGRAPHER_THRESHOLD_SCAN {rawparams}
    {% else %}
      RESPOND TYPE=error MSG='Cartographer is configured for scan, not touch!'
    {% endif %}
  {% endif %}


[gcode_macro CARTOGRAPHER_CALIBRATE]
rename_existing: _CARTOGRAPHER_CALIBRATE
gcode:
  {% set verify_firmware = printer["gcode_macro _CARTOTOUCH_VARIABLES"].verify_firmware %}
  {% set mcu_version = printer['mcu scanner'].mcu_version|default('') %}
  {% if verify_firmware and 'K1' not in mcu_version and 'Lite' not in mcu_version %}
    RESPOND TYPE=error MSG="Cartographer Calibrate aborted: You must flash the cartographer with K1 specific firmware!"
    RESPOND TYPE=error MSG="See https://pellcorp.github.io/creality-wiki/invalid-cartotouch-firmware"
  {% else %}
