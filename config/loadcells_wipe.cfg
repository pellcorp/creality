# Load cell wipe for Simple AF
#
# Cleans the nozzle by scraping it across the back of the bed, based on the way Creality's stock
# firmware does it, so there is no plastic on the tip throwing off the load cell taps.
#
# The installer includes it for the loadcells probe.
#
# START_PRINT runs it through the _SAF_NOZZLE_WIPE hook, before the bed mesh.
#
# To use your own _SAF_NOZZLE_WIPE instead, remove the include for this file.
#
# What it does:
#   1. heats the bed and the nozzle to a cool temp (print temp - 90, max 180) and homes Z with the load cells
#   2. picks a random 30mm line in the middle third of X, 3 to 5mm in from Y max
#   3. taps both ends of the line until the taps agree, to find the bed height at each end
#   4. lowers to 0.15mm above the start, heats to the wipe temp (print temp - 50)
#   5. wipes slowly along the line, sloping 0.15mm into the bed at the end
#   6. cools with the part fan, lifts off, then restores the bed mesh and nozzle temp
#
# It can also be run by hand, the temps default to PLA:
#   _SAF_NOZZLE_WIPE EXTRUDER_TEMP=210 BED_TEMP=60
#
# Currently it requires the loadcells probe, as it measures the bed with PROBE.

[gcode_macro _LOAD_CELL_WIPE_PARAMS]
# with loadcells for z-offset and a rear mounted probe the wipe is skipped, set this True to still wipe, it will be forced on the side
variable_rear_mount_wipe: False
gcode:

[gcode_macro _SAF_NOZZLE_WIPE]
gcode:
    {% set lc = printer.configfile.settings.load_cell_probe %}
    # true if the load cells are the probe, false if they are only used for z-offset
    {% set lc_probe = lc.register_as_probe|default(True) %}
    # with loadcells for z-offset there is another probe on the toolhead, find how far it sits
    # in front of (negative) or behind (positive) the nozzle from whichever probe section exists
    {% set probe_y = namespace(offset=0) %}
    {% for name in ['bltouch', 'probe', 'probe_eddy_current btt_eddy', 'probe_eddy_ng btt_eddy', 'cartographer', 'scanner', 'beacon'] %}
      {% if name in printer.configfile.settings and printer.configfile.settings[name].y_offset is defined %}
        {% set probe_y.offset = printer.configfile.settings[name].y_offset %}
      {% endif %}
    {% endfor %}
    # if that probe is behind the nozzle it could hit the back of the bed when wiping at the back
    {% set rear_probe = not lc_probe and probe_y.offset > 0 %}
    # wipe on the side if there is only one load cell (it can't feel taps at the back) or the probe is
    # behind the nozzle, otherwise wipe at the back like stock
    {% set side = not lc_probe and (lc.sensor_type == 'hx711' or rear_probe) %}
    # with a probe behind the nozzle skip the wipe, unless rear_mount_wipe is set to True
    {% if rear_probe and not printer["gcode_macro _LOAD_CELL_WIPE_PARAMS"].rear_mount_wipe %}
      RESPOND TYPE=error MSG="Load cell wipe skipped for a rear mounted probe, set variable_rear_mount_wipe: True in _LOAD_CELL_WIPE_PARAMS to wipe on the side"
    {% else %}
      {% set min_x = printer.configfile.settings.stepper_x.position_min %}
      {% set max_x = printer.configfile.settings.stepper_x.position_max %}
      {% set min_y = printer.configfile.settings.stepper_y.position_min %}
      {% set max_y = printer.configfile.settings.stepper_y.position_max %}
      {% set zero = printer.configfile.settings.bed_mesh.zero_reference_position|default([(min_x + max_x) / 2, (min_y + max_y) / 2]) %}
      {% set third = (max_x - min_x) / 3 %}
      {% set temp = [params.EXTRUDER_TEMP|default(210)|float, 180]|max %}
      {% set bed = params.BED_TEMP|default(60)|float %}
      {% set hot_min = [temp - 90, 180]|min %}
      # back wipe line, along X
      {% set sx = min_x + third + (range(0, 1001)|random) / 1000.0 * (third - 35) %}
      {% set sy = max_y - 5 + (range(0, 1001)|random) / 1000.0 * 2 %}
      {% set ex = sx + 30 %}
      {% set ey = sy %}
      # side wipe line, along Y on the bed
      {% if side %}
        {% set bed_y = [min_y, 0]|max %}
        {% set sx = [min_x, 0]|max + 3 + (range(0, 1001)|random) / 1000.0 * 2 %}
        {% set sy = bed_y + 20 + (range(0, 1001)|random) / 1000.0 * ((max_y - bed_y) / 3 - 50) %}
        {% set ex = sx %}
        {% set ey = sy + 30 %}
      {% endif %}

      RESPOND TYPE=command MSG="Wiping nozzle"
      RESPOND TYPE=command MSG="Load cell wipe: heating bed to {bed}, nozzle to {hot_min}"
      M140 S{bed}
      M104 S{hot_min}
      {% if printer.toolhead.homed_axes != "xyz" %}
        RESPOND TYPE=command MSG="Load cell wipe: homing"
        G28
      {% endif %}
      G90
      RESPOND TYPE=command MSG="Load cell wipe: waiting for nozzle {hot_min}"
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_min - 10} MAXIMUM={hot_min + 10}

      {% if lc_probe %}
        RESPOND TYPE=command MSG="Load cell wipe: moving to zero reference {zero[0]}, {zero[1]}"
        G1 X{zero[0]} Y{zero[1]} Z5 F12000
      {% endif %}
      {% if bed > 0 %}
        RESPOND TYPE=command MSG="Load cell wipe: waiting for bed {bed}"
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 5} MAXIMUM={bed + 5}
      {% endif %}
      {% if lc_probe %}
        RESPOND TYPE=command MSG="Load cell wipe: Z home probe 1"
        M400
        G4 P5000
        PROBE PROBE_SPEED=2.5 SAMPLES=1 HOME=Z
        G1 Z5 F300
        RESPOND TYPE=command MSG="Load cell wipe: Z home probe 2"
        M400
        G4 P5000
        PROBE PROBE_SPEED=2.5 SAMPLES=1 HOME=Z
        G1 Z5 F300
      {% endif %}
      M104 S{hot_min + 40}

      RESPOND TYPE=command MSG="Load cell wipe: moving to wipe start {sx|round(2)}, {sy|round(2)}"
      G1 X{sx} Y{sy} Z5 F12000
      _LOAD_CELL_WIPE_MEASURE POINT=src_z NAME=start

      RESPOND TYPE=command MSG="Load cell wipe: moving to wipe end {ex|round(2)}, {ey|round(2)}"
      G1 X{ex} Y{ey} Z5 F12000
      M106 S0
      _LOAD_CELL_WIPE_MEASURE POINT=end_z NAME=end

   # pass the wipe line and temps to the next phase, a separate macro so it can read the measured tap heights
      _LOAD_CELL_WIPE_RUN SX={sx} SY={sy} EX={ex} EY={ey} HOT_MIN={hot_min} HOT_MAX={temp - 50} RESTORE={printer.extruder.target} MESH="{printer.bed_mesh.profile_name}"
      G0 Z8 F900
    {% endif %}
    
[gcode_macro _LOAD_CELL_WIPE_MEASURE]
variable_results: []
variable_done: False
variable_src_z: 0
variable_end_z: 0
gcode:
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE=results VALUE="[]"
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE=done VALUE=False
    {% for i in range(5) %}
      _LOAD_CELL_WIPE_TAP NAME={params.NAME}
    {% endfor %}
    _LOAD_CELL_WIPE_SAVE POINT={params.POINT} NAME={params.NAME}

[gcode_macro _LOAD_CELL_WIPE_TAP]
gcode:
    {% set state = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"] %}
    {% set lc_probe = printer.configfile.settings.load_cell_probe.register_as_probe|default(True) %}
    {% if not state.done %}
      RESPOND TYPE=command MSG="Load cell wipe: {params.NAME} probe {state.results|length + 1}"
      M400
      G4 P5000
      # PROBE for the loadcells probe, LOAD_CELL_PROBE for loadcells for z-offset
      {'PROBE' if lc_probe else 'LOAD_CELL_PROBE'} PROBE_SPEED=2.5 SAMPLES=1
      _LOAD_CELL_WIPE_TAP_RESULT
    {% endif %}

[gcode_macro _LOAD_CELL_WIPE_TAP_RESULT]
gcode:
    {% set lc_probe = printer.configfile.settings.load_cell_probe.register_as_probe|default(True) %}
    # the load cell result is on probe for the loadcells probe, load_cell_probe for loadcells for z-offset
    {% set z = printer.probe.last_z_result if lc_probe else printer.load_cell_probe.last_z_result %}
    {% set results = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"].results + [z] %}
    {% set done = results|length >= 5 or (results|length >= 2 and (results|max - results|min) <= 0.1) %}
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE=results VALUE="{results}"
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE=done VALUE={done}
    G1 Z{5 if done else z + 1.5} F300

[gcode_macro _LOAD_CELL_WIPE_SAVE]
gcode:
    {% set results = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"].results|sort %}
    {% set z = (results[0] + results[1]) / 2 if results|length == 2 else results[(results|length - 1) // 2] %}
    RESPOND TYPE=command MSG="Load cell wipe: {params.NAME} height {z|round(3)} from {results|length} probes"
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE={params.POINT} VALUE={z}

[gcode_macro _LOAD_CELL_WIPE_RUN]
gcode:
    {% set state = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"] %}
    # sx/ex start/end X and sy/ey start/end Y of the wipe line
    {% set sx = params.SX|float %}
    {% set sy = params.SY|float %}
    {% set ex = params.EX|float %}
    {% set ey = params.EY|float %}
    {% set hot_min = params.HOT_MIN|float %}
    {% set hot_max = params.HOT_MAX|float %}

    RESPOND TYPE=command MSG="Load cell wipe: lowering to {(state.src_z + 0.15)|round(3)}"
    G1 X{sx} Y{sy} Z5 F12000
    G1 Z{state.src_z + 0.15} F300
    RESPOND TYPE=command MSG="Load cell wipe: heating nozzle to {hot_max}"
    M104 S{hot_max}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_max - 10} MAXIMUM={hot_max + 10}

    RESPOND TYPE=command MSG="Load cell wipe: wiping to {(state.end_z - 0.15)|round(3)}"
    G1 X{ex} Y{ey} Z{state.end_z - 0.15} F120
    RESPOND TYPE=command MSG="Load cell wipe: cooling nozzle to {hot_min}"
    M106 S255
    M104 S{hot_min}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_min - 5} MAXIMUM={hot_min + 5}

    RESPOND TYPE=command MSG="Load cell wipe: lifting off"
    G1 X{ex + ex - sx} Y{ey + ey - sy} Z{state.end_z + 5} F120
    M106 S0
    RESPOND TYPE=command MSG="Load cell wipe: restoring nozzle to {params.RESTORE|float}"
    M109 S{params.RESTORE|float}
    RESPOND TYPE=command MSG="Load cell wipe: done"
