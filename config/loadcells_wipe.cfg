# Load cell wipe for Simple AF
#
# Cleans the nozzle by scraping it across the back or side of the bed, based on the way Creality's stock
# firmware does it, so there is no plastic on the tip throwing off the load cell taps.
#
# The installer includes it for the loadcells probe and loadcells for z-offset.
#
# START_PRINT runs it through the _SAF_NOZZLE_WIPE hook, before the bed mesh.
#
# To use your own _SAF_NOZZLE_WIPE instead, remove the include for this file.
#
# What it does:
#   1. heats the bed and the nozzle to a cool temp (print temp - 90, max 180) and homes Z with the load cells (loadcells probe with Z homed on a switch only)
#   2. picks a random 30mm line in the middle third of X, 3 to 5mm in from Y max
#      (loadcells for z-offset with a single load cell or a rear mounted probe: the front third of Y, 3 to 5mm in from X min,
#      moved right for a probe left of the nozzle so the probe goes no further left than X min,
#      a single load cell always starts 20mm in from the front, near the cell)
#   3. taps both ends of the line until the taps agree, to find the bed height at each end
#      (a single load cell only taps the start and uses that height for the whole line)
#   4. lowers to 0.15mm above the start, heats to the wipe temp (print temp - 50)
#   5. wipes slowly along the line, sloping 0.15mm into the bed at the end
#   6. cools with the part fan, lifts off, then restores the bed mesh and nozzle temp
#
# It can also be run by hand, the temps default to PLA:
#   _SAF_NOZZLE_WIPE EXTRUDER_TEMP=210 BED_TEMP=60

# _SAF_NOZZLE_WIPE steps:
#   1. work out the setup: loadcells probe or loadcells for z-offset, single load cell, rear mounted probe
#   2. skip the wipe if kalico is out of date
#   3. read the travel limits and the zero reference point
#   4. work out the print, bed and cool temps
#   5. pick the wipe line, at the back or on the side
#   6. heat the bed and nozzle
#   7. home Z with the load cells (loadcells probe with Z homed on a switch only)
#   8. move to each end of the line (only the start for a single load cell) and call _LOAD_CELL_WIPE_MEASURE,
#      which taps it to get the bed height
#   9. call _LOAD_CELL_WIPE_RUN with the line and temps, which does the wipe

[gcode_macro _SAF_NOZZLE_WIPE]
gcode:
    {% set lc = printer.configfile.settings.load_cell_probe %}
    # true if the load cells are the probe, false if they are only used for z-offset
    {% set lc_probe = lc.register_as_probe|default(True) %}
    # Z homed on a switch (like the F001), not the load cells, so home Z with them before the wipe
    {% set home_taps = lc_probe and 'probe:z_virtual_endstop' not in printer.configfile.settings.stepper_z.endstop_pin %}
    # with loadcells for z-offset there is another probe on the toolhead, find how far it sits
    # in front of (negative) or behind (positive) and left (negative) or right (positive) of the nozzle
    # from whichever probe section exists
    {% set probe = namespace(x=0, y=0) %}
    {% for name in ['bltouch', 'probe', 'probe_eddy_current btt_eddy', 'probe_eddy_ng btt_eddy', 'cartographer', 'scanner', 'beacon'] %}
      {% if name in printer.configfile.settings and printer.configfile.settings[name].y_offset is defined %}
        {% set probe.x = printer.configfile.settings[name].x_offset|default(0) %}
        {% set probe.y = printer.configfile.settings[name].y_offset %}
      {% endif %}
    {% endfor %}
    # if that probe is behind the nozzle it could hit the frame when wiping at the back
    {% set rear_probe = not lc_probe and probe.y > 0 %}
    # wipe on the side if there is only one load cell (it can't feel taps at the back) or the probe is
    # behind the nozzle, otherwise wipe at the back like stock
    {% set side = not lc_probe and (lc.sensor_type == 'hx711' or rear_probe) %}
    # one load cell under the bed can't feel a tap 30mm away, so it only taps the start of the line
    {% set single = not lc_probe and lc.sensor_type == 'hx711' %}
    # the K1C and K1 SE have a brush at the back, only they have a stock max Z velocity of 10
    {% set brush = not side and printer.configfile.settings.printer.max_z_velocity == 10 %}
    # older kalico does not report last_z_result, which the taps need
    {% set tap_status = printer.probe if lc_probe else printer.load_cell_probe %}
    {% if tap_status.last_z_result is not defined %}
      RESPOND TYPE=error MSG="Load cell wipe skipped, Kalico is out of date, update Kalico to use the load cell wipe"
    {% else %}
      # how far the nozzle can travel in X and Y
      {% set min_x = printer.configfile.settings.stepper_x.position_min %}
      {% set max_x = printer.configfile.settings.stepper_x.position_max %}
      {% set min_y = printer.configfile.settings.stepper_y.position_min %}
      {% set max_y = printer.configfile.settings.stepper_y.position_max %}
      # zero reference point for the homing taps, the middle of the travel if not set
      {% set zero = printer.configfile.settings.bed_mesh.zero_reference_position|default([(min_x + max_x) / 2, (min_y + max_y) / 2]) %}
      # a third of the X travel, to put the back line in the middle of the bed
      {% set third = (max_x - min_x) / 3 %}
      # print temp (at least 180, PLA if run by hand), bed temp, and the cool temp for tapping (print temp - 90, max 180)
      {% set temp = [params.EXTRUDER_TEMP|default(210)|float, 180]|max %}
      {% set bed = params.BED_TEMP|default(60)|float %}
      {% set hot_min = [temp - 90, 180]|min %}
      # back wipe line, along X: a random 30mm in the middle third of X, 3 to 5mm in from Y max
      {% set sx = min_x + third + (range(0, 1001)|random) / 1000.0 * (third - 35) %}
      {% set sy = max_y - 5 + (range(0, 1001)|random) / 1000.0 * 2 %}
      {% set ex = sx + 30 %}
      {% set ey = sy %}
      # side wipe line, along Y on the bed, 3 to 5mm in from the bed edge or, with a probe left of the
      # nozzle, from where the probe reaches X min (X min - probe x offset)
      {% if side %}
        {% set bed_y = [min_y, 0]|max %}
        {% set sx = [[min_x, 0]|max, min_x - [probe.x, 0]|min]|max + 3 + (range(0, 1001)|random) / 1000.0 * 2 %}
        # a single load cell sits under the front left of the bed, so its tap is always 20mm in from the
        # front where the cell can read it, otherwise a random start in the front third of Y
        {% set sy = bed_y + 20 if single else bed_y + 20 + (range(0, 1001)|random) / 1000.0 * ((max_y - bed_y) / 3 - 50) %}
        {% set ex = sx %}
        {% set ey = sy + 30 %}
      {% endif %}
      # the stock K1C and K1 SE brush line, tapped at both ends like stock
      {% if brush %}
        {% set sx, sy, ex, ey = 87, 225, 133, 225 %}
      {% endif %}

      RESPOND TYPE=command MSG="Wiping nozzle"
      RESPOND TYPE=command MSG="Load cell wipe: heating bed to {bed}, nozzle to {hot_min}"
      M140 S{bed}
      M104 S{hot_min}
      {% if printer.toolhead.homed_axes != "xyz" %}
        RESPOND TYPE=command MSG="Load cell wipe: homing"
        G28
      {% endif %}
      BED_MESH_CLEAR
      G90
      RESPOND TYPE=command MSG="Load cell wipe: waiting for nozzle {hot_min}"
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_min - 10} MAXIMUM={hot_min + 10}

      {% if home_taps %}
        RESPOND TYPE=command MSG="Load cell wipe: moving to zero reference {zero[0]}, {zero[1]}"
        G1 X{zero[0]} Y{zero[1]} Z5 F12000
      {% endif %}
      {% if bed > 0 %}
        RESPOND TYPE=command MSG="Load cell wipe: waiting for bed {bed}"
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 5} MAXIMUM={bed + 5}
      {% endif %}
      {% if home_taps %}
        RESPOND TYPE=command MSG="Load cell wipe: Z home probe 1"
        M400
        G4 P5000
        PROBE SAMPLES=1 HOME=Z
        G1 Z5 F300
        RESPOND TYPE=command MSG="Load cell wipe: Z home probe 2"
        M400
        G4 P5000
        PROBE SAMPLES=1 HOME=Z
        G1 Z5 F300
      {% endif %}
      M104 S{hot_min + 40}

      RESPOND TYPE=command MSG="Load cell wipe: moving to wipe start {sx|round(2)}, {sy|round(2)}"
      G1 X{sx} Y{sy} Z5 F12000
      _LOAD_CELL_WIPE_MEASURE POINT=src_z NAME=start

      {% if not single %}
        RESPOND TYPE=command MSG="Load cell wipe: moving to wipe end {ex|round(2)}, {ey|round(2)}"
        G1 X{ex} Y{ey} Z5 F12000
      {% endif %}
      M106 S0
      {% if not single %}
        _LOAD_CELL_WIPE_MEASURE POINT=end_z NAME=end
      {% endif %}

   # pass the wipe line and temps to the next phase, a separate macro so it can read the measured tap heights
      _LOAD_CELL_WIPE_{'BRUSH' if brush else 'RUN'} SX={sx} SY={sy} EX={ex} EY={ey} HOT_MIN={hot_min} HOT_MAX={temp - 50} RESTORE={printer.extruder.target} MESH="{printer.bed_mesh.profile_name}" SINGLE={1 if single else 0}
    {% endif %}

# helpers

# _LOAD_CELL_WIPE_MEASURE steps (called twice):
#   1. clear the taps from the last end of the line
#   2. call _LOAD_CELL_WIPE_TAP up to 5 times, it stops tapping once two taps agree within 0.1mm
#   3. call _LOAD_CELL_WIPE_SAVE, which stores the bed height for this end

[gcode_macro _LOAD_CELL_WIPE_MEASURE]
# do not edit, these are used internally by the wipe
variable_results: []
variable_done: False
variable_src_z: 0
variable_end_z: 0
gcode:
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE=results VALUE="[]"
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE=done VALUE=False
    {% for i in range(5) %}
      _LOAD_CELL_WIPE_TAP NAME={params.NAME}
    {% endfor %}
    _LOAD_CELL_WIPE_SAVE POINT={params.POINT} NAME={params.NAME}

# _LOAD_CELL_WIPE_TAP steps:
#   1. skip if two taps already agree
#   2. wait 5 seconds for the load cells to settle
#   3. tap with PROBE (loadcells probe) or LOAD_CELL_PROBE (loadcells for z-offset)
#   4. call _LOAD_CELL_WIPE_TAP_RESULT, which reads the tap

[gcode_macro _LOAD_CELL_WIPE_TAP]
gcode:
    {% set state = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"] %}
    {% set lc_probe = printer.configfile.settings.load_cell_probe.register_as_probe|default(True) %}
    {% if not state.done %}
      RESPOND TYPE=command MSG="Load cell wipe: {params.NAME} probe {state.results|length + 1}"
      M400
      G4 P5000
      # PROBE for the loadcells probe, LOAD_CELL_PROBE for loadcells for z-offset
      {'PROBE' if lc_probe else 'LOAD_CELL_PROBE'} SAMPLES=1
      _LOAD_CELL_WIPE_TAP_RESULT
    {% endif %}

# _LOAD_CELL_WIPE_TAP_RESULT steps:
#   1. read the height of the tap
#   2. add it to the taps for this end
#   3. mark this end done after 5 taps, or once two taps agree within 0.1mm
#   4. lift to Z5 when done, otherwise 1.5mm above the tap for the next one

[gcode_macro _LOAD_CELL_WIPE_TAP_RESULT]
gcode:
    {% set lc_probe = printer.configfile.settings.load_cell_probe.register_as_probe|default(True) %}
    # the load cell result is on probe for the loadcells probe, load_cell_probe for loadcells for z-offset
    {% set z = printer.probe.last_z_result if lc_probe else printer.load_cell_probe.last_z_result %}
    {% set results = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"].results + [z] %}
    {% set done = results|length >= 5 or (results|length >= 2 and (results|max - results|min) <= 0.1) %}
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE=results VALUE="{results}"
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE=done VALUE={done}
    G1 Z{5 if done else z + 1.5} F300

# _LOAD_CELL_WIPE_SAVE steps:
#   1. sort the taps for this end
#   2. store the middle tap as the bed height, or the average if there are only two

[gcode_macro _LOAD_CELL_WIPE_SAVE]
gcode:
    {% set results = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"].results|sort %}
    {% set z = (results[0] + results[1]) / 2 if results|length == 2 else results[(results|length - 1) // 2] %}
    RESPOND TYPE=command MSG="Load cell wipe: {params.NAME} height {z|round(3)} from {results|length} probes"
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_WIPE_MEASURE VARIABLE={params.POINT} VALUE={z}

# _LOAD_CELL_WIPE_RUN steps:
#   1. move to the start of the line and lower to 0.15mm above the bed
#   2. heat the nozzle to the wipe temp
#   3. wipe slowly to the end of the line, finishing 0.15mm into the bed
#   4. turn the part fan on and cool the nozzle to the cool temp
#   5. lift off 10mm, carrying on 30mm past the end of the line
#   6. turn the part fan off and restore the bed mesh and nozzle temp

[gcode_macro _LOAD_CELL_WIPE_RUN]
gcode:
    {% set state = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"] %}
    # sx/ex start/end X and sy/ey start/end Y of the wipe line
    {% set sx = params.SX|float %}
    {% set sy = params.SY|float %}
    {% set ex = params.EX|float %}
    {% set ey = params.EY|float %}
    {% set hot_min = params.HOT_MIN|float %}
    {% set hot_max = params.HOT_MAX|float %}
    # one load cell only tapped the start, so the end uses the start height
    {% set end_z = state.src_z if params.SINGLE|default(0)|int else state.end_z %}

    RESPOND TYPE=command MSG="Load cell wipe: lowering to {(state.src_z + 0.15)|round(3)}"
    G1 X{sx} Y{sy} Z5 F12000
    G1 Z{state.src_z + 0.15} F300
    RESPOND TYPE=command MSG="Load cell wipe: heating nozzle to {hot_max}"
    M104 S{hot_max}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_max - 10} MAXIMUM={hot_max + 10}

    RESPOND TYPE=command MSG="Load cell wipe: wiping to {(end_z - 0.15)|round(3)}"
    G1 X{ex} Y{ey} Z{end_z - 0.15} F120
    RESPOND TYPE=command MSG="Load cell wipe: cooling nozzle to {hot_min}"
    M106 S255
    M104 S{hot_min}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_min - 5} MAXIMUM={hot_min + 5}

    RESPOND TYPE=command MSG="Load cell wipe: lifting off"
    # this is here intentionally to hopefully avoid any plastic sticking to the nozzle when its being pulled up
    G1 X{ex + ex - sx} Y{ey + ey - sy} Z{end_z + 10} F120
    M106 S0
    {% if params.MESH %}
      RESPOND TYPE=command MSG="Load cell wipe: loading bed mesh {params.MESH}"
      BED_MESH_PROFILE LOAD="{params.MESH}"
    {% endif %}
    RESPOND TYPE=command MSG="Load cell wipe: restoring nozzle to {params.RESTORE|float}"
    M109 S{params.RESTORE|float}
    RESPOND TYPE=command MSG="Load cell wipe: done"

# _LOAD_CELL_WIPE_BRUSH steps (K1C and K1 SE), the same as the stock quick wipe:
#   1. if either tap is not over 1.6mm there is no brush, so do the stock normal wipe, a random 30mm on the line
#   2. lower 0.2mm into the brush at the end of the line and heat the nozzle to the wipe temp
#   3. scrub 10 times 0.7mm into the brush at 100mm/s, 5mm in from each end
#   4. cool with the part fan 0.2mm into the brush, then scrub 3 more times
#   5. pull 4mm forward off the brush, lift to Z5, then restore the bed mesh and nozzle temp

[gcode_macro _LOAD_CELL_WIPE_BRUSH]
gcode:
    {% set state = printer["gcode_macro _LOAD_CELL_WIPE_MEASURE"] %}
    {% set sx = params.SX|float %}
    {% set sy = params.SY|float %}
    {% set ex = params.EX|float %}
    {% set hot_min = params.HOT_MIN|float %}
    {% set hot_max = params.HOT_MAX|float %}
    {% if state.src_z <= 1.6 or state.end_z <= 1.6 %}
      RESPOND TYPE=command MSG="Load cell wipe: no brush found, wiping on the bed"
      {% set wx = sx + (range(0, 1001)|random) / 1000.0 * (ex - sx - 35) %}
      {% set wy = sy + (range(0, 1001)|random) / 1000.0 %}
      _LOAD_CELL_WIPE_RUN SX={wx} SY={wy} EX={wx + 30} EY={wy} HOT_MIN={hot_min} HOT_MAX={hot_max} RESTORE={params.RESTORE} MESH="{params.MESH}"
    {% else %}
      {% set y = sy + (range(0, 1501)|random) / 1000.0 - 1 %}
      {% set zs = state.src_z - 0.7 %}
      {% set ze = state.end_z - 0.7 %}
      {% set accel = printer.toolhead.max_accel %}
      {% set scv = printer.toolhead.square_corner_velocity %}
      SET_VELOCITY_LIMIT ACCEL=20000 SQUARE_CORNER_VELOCITY=100

      RESPOND TYPE=command MSG="Load cell wipe: brush found, heating nozzle to {hot_max}"
      G1 X{ex} Y{sy} Z{state.end_z + 1} F12000
      G1 Z{state.end_z - 0.2} F300
      M104 S{hot_max}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_max - 10} MAXIMUM={hot_max + 10}

      RESPOND TYPE=command MSG="Load cell wipe: scrubbing brush"
      G1 Z{state.end_z + 1} F300
      G1 X{ex - 5} Y{y} F6000
      G1 Z{ze} F300
      {% for i in range(10) %}
        G1 X{sx + 5} Y{y} Z{zs} F6000
        G1 X{ex - 5} Y{y} Z{ze} F6000
        G1 Y{y - 0.5 if i % 2 else y + 0.5} F6000
        G4 P2000
      {% endfor %}

      RESPOND TYPE=command MSG="Load cell wipe: cooling nozzle to {hot_min}"
      G1 X{ex} Y{sy} Z{state.end_z} F6000
      G1 Z{state.end_z - 0.2} F300
      M106 S255
      M104 S{hot_min}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot_min - 5} MAXIMUM={hot_min + 5}

      RESPOND TYPE=command MSG="Load cell wipe: scrubbing brush cold"
      G1 Z{state.end_z + 1} F300
      G1 X{ex - 5} Y{y} F6000
      G1 Z{ze} F300
      {% for i in range(3) %}
        G1 X{sx + 5} Y{y} Z{zs} F6000
        G1 X{ex - 5} Y{y} Z{ze} F6000
        G1 Y{y - 0.5} F6000
        G4 P2000
      {% endfor %}

      RESPOND TYPE=command MSG="Load cell wipe: lifting off"
      G1 X{ex - 5} Y{y} Z{ze} F6000
      G1 Y{y - 4} F6000
      G1 X{sx + 5} Y{y - 4} Z5 F12000
      M106 S0
      SET_VELOCITY_LIMIT ACCEL={accel} SQUARE_CORNER_VELOCITY={scv}
      {% if params.MESH %}
        BED_MESH_PROFILE LOAD="{params.MESH}"
      {% endif %}
      M109 S{params.RESTORE|float}
      RESPOND TYPE=command MSG="Load cell wipe: done"
    {% endif %}
