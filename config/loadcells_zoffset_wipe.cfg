# Load cell wipe for Simple AF
#
# Cleans the nozzle by scraping it along a strip on the left edge of the bed, based on the way Creality's stock
# firmware does it, so there is no plastic on the tip throwing off the load cell taps.
#
# The installer includes it for loadcells for z-offset.
#
# START_PRINT runs it through the _SAF_NOZZLE_WIPE hook, before the bed mesh.
#
# To use your own _SAF_NOZZLE_WIPE instead, remove the include for this file.
#
# What it does:
#   1. heats the bed and the nozzle to a cool temp (180)
#   2. picks a random 30mm line in the front third of Y, 3 to 5mm in from X min
#   3. taps both ends of the line until the taps agree, to find the bed height at each end
#   4. lowers to 0.15mm above the start, 5mm in, heats to the wipe temp (200) and retracts
#   5. wipes slowly along the line to 5mm from the end, sloping 0.15mm into the bed at the end
#   6. cools to 140 with the part fan, lifts off, then restores the bed mesh and nozzle temp
#
# It can also be run by hand, the bed temp defaults to PLA:
#   _SAF_NOZZLE_WIPE BED_TEMP=60
#
# Currently it requires kalico with load_cell_probe last_z_result, as it measures the bed with LOAD_CELL_PROBE.

[gcode_macro _SAF_NOZZLE_WIPE]
gcode:
    {% if printer.load_cell_probe.last_z_result is not defined %}
      RESPOND TYPE=error MSG="Load cell wipe requires kalico with load_cell_probe last_z_result"
    {% else %}
      {% set bed = params.BED_TEMP|default(60)|float %}
      {% set min_x = [printer.configfile.settings.stepper_x.position_min, 0]|max %}
      {% set min_y = [printer.configfile.settings.stepper_y.position_min, 0]|max %}
      {% set max_y = printer.configfile.settings.stepper_y.position_max %}
      {% set third = (max_y - min_y) / 3 %}
      {% set x = min_x + 3 + (range(0, 1001)|random) / 1000.0 * 2 %}
      {% set y = min_y + 20 + (range(0, 1001)|random) / 1000.0 * (third - 50) %}

      RESPOND TYPE=command MSG="Wiping nozzle"
      RESPOND TYPE=command MSG="Load cell wipe: heating bed to {bed}, nozzle to 180"
      M140 S{bed}
      M104 S180
      {% if printer.toolhead.homed_axes != "xyz" %}
        RESPOND TYPE=command MSG="Load cell wipe: homing"
        G28
      {% endif %}
      BED_MESH_CLEAR
      G90
      RESPOND TYPE=command MSG="Load cell wipe: waiting for nozzle 180"
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM=170 MAXIMUM=190
      {% if bed > 0 %}
        RESPOND TYPE=command MSG="Load cell wipe: waiting for bed {bed}"
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 5} MAXIMUM={bed + 5}
      {% endif %}

      RESPOND TYPE=command MSG="Load cell wipe: moving to wipe start {x|round(2)}, {y|round(2)}"
      G1 X{x} Y{y} Z5 F12000
      _LOAD_CELL_ZOFFSET_WIPE_MEASURE POINT=src_z NAME=start

      RESPOND TYPE=command MSG="Load cell wipe: moving to wipe end {x|round(2)}, {(y + 30)|round(2)}"
      G1 X{x} Y{y + 30} Z5 F12000
      _LOAD_CELL_ZOFFSET_WIPE_MEASURE POINT=end_z NAME=end

      _LOAD_CELL_ZOFFSET_WIPE_RUN X={x} Y={y} RESTORE={printer.extruder.target} MESH="{printer.bed_mesh.profile_name}"
    {% endif %}

[gcode_macro _LOAD_CELL_ZOFFSET_WIPE_MEASURE]
variable_results: []
variable_done: False
variable_src_z: 0
variable_end_z: 0
gcode:
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_ZOFFSET_WIPE_MEASURE VARIABLE=results VALUE="[]"
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_ZOFFSET_WIPE_MEASURE VARIABLE=done VALUE=False
    {% for i in range(5) %}
      _LOAD_CELL_ZOFFSET_WIPE_TAP NAME={params.NAME}
    {% endfor %}
    _LOAD_CELL_ZOFFSET_WIPE_SAVE POINT={params.POINT} NAME={params.NAME}

[gcode_macro _LOAD_CELL_ZOFFSET_WIPE_TAP]
gcode:
    {% set state = printer["gcode_macro _LOAD_CELL_ZOFFSET_WIPE_MEASURE"] %}
    {% if not state.done %}
      RESPOND TYPE=command MSG="Load cell wipe: {params.NAME} probe {state.results|length + 1}"
      M400
      G4 P5000
      LOAD_CELL_PROBE PROBE_SPEED=2.5 SAMPLES=1
      _LOAD_CELL_ZOFFSET_WIPE_TAP_RESULT
    {% endif %}

[gcode_macro _LOAD_CELL_ZOFFSET_WIPE_TAP_RESULT]
gcode:
    {% set z = printer.load_cell_probe.last_z_result %}
    {% set results = printer["gcode_macro _LOAD_CELL_ZOFFSET_WIPE_MEASURE"].results + [z] %}
    {% set done = results|length >= 5 or (results|length >= 2 and (results|max - results|min) <= 0.1) %}
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_ZOFFSET_WIPE_MEASURE VARIABLE=results VALUE="{results}"
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_ZOFFSET_WIPE_MEASURE VARIABLE=done VALUE={done}
    G1 Z{5 if done else z + 1.5} F300

[gcode_macro _LOAD_CELL_ZOFFSET_WIPE_SAVE]
gcode:
    {% set results = printer["gcode_macro _LOAD_CELL_ZOFFSET_WIPE_MEASURE"].results|sort %}
    {% set z = (results[0] + results[1]) / 2 if results|length == 2 else results[(results|length - 1) // 2] %}
    RESPOND TYPE=command MSG="Load cell wipe: {params.NAME} height {z|round(3)} from {results|length} probes"
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_ZOFFSET_WIPE_MEASURE VARIABLE={params.POINT} VALUE={z}

[gcode_macro _LOAD_CELL_ZOFFSET_WIPE_RUN]
gcode:
    {% set state = printer["gcode_macro _LOAD_CELL_ZOFFSET_WIPE_MEASURE"] %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}

    RESPOND TYPE=command MSG="Load cell wipe: lowering to {(state.src_z + 0.15)|round(3)}"
    G1 X{x} Y{y} Z5 F12000
    G1 Y{y + 5} Z{state.src_z + 0.15} F300
    RESPOND TYPE=command MSG="Load cell wipe: heating nozzle to 200"
    M104 S200
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=190 MAXIMUM=210
    RESPOND TYPE=command MSG="Load cell wipe: retracting 5"
    G91
    G1 E-5 F1800
    G90

    RESPOND TYPE=command MSG="Load cell wipe: wiping to {(state.end_z - 0.15)|round(3)}"
    G1 Y{y + 25} Z{state.end_z - 0.15} F120
    RESPOND TYPE=command MSG="Load cell wipe: cooling nozzle to 140"
    M106 S255
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=135 MAXIMUM=145

    RESPOND TYPE=command MSG="Load cell wipe: lifting off"
    G1 X{x + 30} Y{y + 30} Z{state.end_z + 5} F6000
    M106 S0
    {% if params.MESH %}
      RESPOND TYPE=command MSG="Load cell wipe: loading bed mesh {params.MESH}"
      BED_MESH_PROFILE LOAD="{params.MESH}"
    {% endif %}
    RESPOND TYPE=command MSG="Load cell wipe: restoring nozzle to {params.RESTORE|float}"
    M109 S{params.RESTORE|float}
    RESPOND TYPE=command MSG="Load cell wipe: done"
