[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% if printer["gcode_macro _SAF_BED_MESH_START"] != null %}
      _SAF_BED_MESH_START
    {% endif %}

    _BED_MESH_CALIBRATE {rawparams}

    {% if printer["gcode_macro _SAF_BED_MESH_END"] != null %}
      _SAF_BED_MESH_END
    {% endif %}

[gcode_macro _LOAD_CELL_HOME_Z]
gcode:
    {% set preheat_nozzle_temp = printer["gcode_macro _START_END_PARAMS"].start_preheat_nozzle_temp %}
    M109 S{preheat_nozzle_temp} # wait for nozzle temp

    # flag that tap phase is starting, so a failed tap keeps the heaters and motors on
    _START_PRINT_TOUCH_STATE BED_TARGET={printer.heater_bed.target} EXTRUDER_TARGET={preheat_nozzle_temp}
    SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=touch_started VALUE=True

    G90
    G0 Z10 F900
    {% set pos = printer.configfile.settings.bed_mesh.zero_reference_position %}
    G1 X{pos[0]} Y{pos[1]} F6000
    PROBE HOME=Z
    G0 Z8 F900

    # flag that tap phase is ending
    SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=touch_started VALUE=False

[gcode_macro LOAD_CELL_DIAGNOSTIC]
rename_existing: _LOAD_CELL_DIAGNOSTIC
gcode:
    _LOAD_CELL_DIAGNOSTIC {rawparams}

# guided with prompt dialogs, from the screen or fluidd/mainsail: TARE, the known load, CALIBRATE,
# ACCEPT. The weight is the GRAMS param (its box in the fluidd/mainsail macros panel), or grumpyscreen
# asks for it with its numpad, otherwise it is typed in the console
[gcode_macro LOAD_CELL_CALIBRATE]
rename_existing: _LOAD_CELL_CALIBRATE
gcode:
    {% set grams = params.GRAMS|default(0)|int %}
    _LOAD_CELL_CALIBRATE {rawparams}
    RESPOND TYPE=command MSG="action:prompt_begin Load Cell Calibration"
    RESPOND TYPE=command MSG="action:prompt_text Remove all load from the bed, then press Tare."
    RESPOND TYPE=command MSG="action:prompt_button Tare|_LOAD_CELL_CALIBRATE_TARE GRAMS={grams}|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Abort|_LOAD_CELL_CALIBRATE_ABORT|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_CELL_CALIBRATE_TARE]
gcode:
    {% set grams = params.GRAMS|int %}
    TARE
    RESPOND TYPE=command MSG="action:prompt_begin Load Cell Calibration"
    {% if grams >= 50 %}
      RESPOND TYPE=command MSG="action:prompt_text Place the {grams} g load in the centre of the bed, then press Calibrate."
      RESPOND TYPE=command MSG="action:prompt_button Calibrate|_LOAD_CELL_CALIBRATE_WEIGHT GRAMS={grams}|primary"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Place your known load in the centre of the bed, then enter its weight in grams."
      RESPOND TYPE=command MSG="action:prompt_button Enter weight|_LOAD_CELL_CALIBRATE_PAD|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Abort|_LOAD_CELL_CALIBRATE_ABORT|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_CELL_CALIBRATE_WEIGHT]
gcode:
    {% if params.GRAMS == "NUMPAD" %}
      # a prompt has no text entry, grumpyscreen opens its numpad for this button and never
      # sends NUMPAD, anywhere else the weight is picked a digit at a time
      _LOAD_CELL_CALIBRATE_PAD
    {% elif params.GRAMS|int < 50 %}
      # kalico takes 50 g or more
      RESPOND TYPE=error MSG="The weight must be at least 50 g"
    {% else %}
      # the prompt stays up until this works, CALIBRATE errors on a load it can barely see
      CALIBRATE GRAMS={params.GRAMS}
      RESPOND TYPE=command MSG="action:prompt_begin Load Cell Calibration"
      RESPOND TYPE=command MSG="action:prompt_text Accept saves the calibration and restarts the printer."
      RESPOND TYPE=command MSG="action:prompt_footer_button Abort|_LOAD_CELL_CALIBRATE_ABORT|error"
      RESPOND TYPE=command MSG="action:prompt_footer_button Accept|_LOAD_CELL_CALIBRATE_ACCEPT|primary"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

# the weight one digit at a time, thousands to units; every screen gets this prompt, grumpyscreen
# opens its numpad for the Start over button (GRAMS=NUMPAD) as soon as it shows, elsewhere it's a
# restart of the digits
[gcode_macro _LOAD_CELL_CALIBRATE_PAD]
gcode:
    {% set digits = params.DIGITS|default("") %}
    {% set place = ["thousands", "hundreds", "tens", "units"][digits|length] %}
    RESPOND TYPE=command MSG="action:prompt_begin Load Cell Calibration"
    RESPOND TYPE=command MSG="action:prompt_text Enter the weight below, or on the printer screen."
    RESPOND TYPE=command MSG="action:prompt_text Weight: {digits ~ '_' * (4 - digits|length)} g, choose the {place}"
    {% for row in [[1, 2, 3], [4, 5, 6], [7, 8, 9], [0]] %}
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% for digit in row %}
        {% if digits|length == 3 %}
          RESPOND TYPE=command MSG="action:prompt_button {digit}|_LOAD_CELL_CALIBRATE_CONFIRM GRAMS={(digits ~ digit)|int}"
        {% else %}
          RESPOND TYPE=command MSG="action:prompt_button {digit}|_LOAD_CELL_CALIBRATE_PAD DIGITS={digits ~ digit}"
        {% endif %}
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button Start over|_LOAD_CELL_CALIBRATE_WEIGHT GRAMS=NUMPAD|primary"
    {% if digits %}
      RESPOND TYPE=command MSG="action:prompt_footer_button Back|_LOAD_CELL_CALIBRATE_PAD DIGITS={digits[:-1]}"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Abort|_LOAD_CELL_CALIBRATE_ABORT|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_CELL_CALIBRATE_CONFIRM]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Load Cell Calibration"
    RESPOND TYPE=command MSG="action:prompt_text {params.GRAMS} g?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Try again|_LOAD_CELL_CALIBRATE_PAD"
    RESPOND TYPE=command MSG="action:prompt_footer_button OK|_LOAD_CELL_CALIBRATE_WEIGHT GRAMS={params.GRAMS}|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_CELL_CALIBRATE_ACCEPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    ACCEPT
    SAVE_CONFIG

[gcode_macro _LOAD_CELL_CALIBRATE_ABORT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    ABORT

[gcode_macro LOAD_CELL_TEST_TAP]
rename_existing: _LOAD_CELL_TEST_TAP
gcode:
    _LOAD_CELL_TEST_TAP {rawparams}
