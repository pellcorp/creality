[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% if printer["gcode_macro _SAF_BED_MESH_START"] != null %}
      _SAF_BED_MESH_START
    {% endif %}

    _BED_MESH_CALIBRATE {rawparams}

    {% if printer["gcode_macro _SAF_BED_MESH_END"] != null %}
      _SAF_BED_MESH_END
    {% endif %}

# [load_cell_probe] has no name suffix, so LOAD_CELL_TARE/READ/DIAGNOSTIC/
# CALIBRATE are all real, bare stock commands -- no LOAD_CELL=<name> needed,
# and no wrapper macro needed either. Kept below only as documentation.
#
# LOAD_CELL_TARE           -- zero the combined signal
# LOAD_CELL_CALIBRATE      -- guided weight calibration (TARE / CALIBRATE
#                              GRAMS=<n> / ACCEPT), or TARE=TRUE SAVE=TRUE
#                              for a quick retare-and-persist
# LOAD_CELL_READ           -- one-shot reading, per-channel breakdown included
# LOAD_CELL_DIAGNOSTIC     -- sensor health, error/overflow counts
# LOAD_CELL_TEST_TAP       -- fixed-position tap, boolean trigger smoke test
