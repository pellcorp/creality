[gcode_macro _CAM_BRIGHTNESS]
gcode:
    {% set brightness = params.BRIGHTNESS|default('default') %}
    RUN_SHELL_COMMAND CMD=camera-control PARAMS="CONTROL=brightness VALUE={brightness}"

