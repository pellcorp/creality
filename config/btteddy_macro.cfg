[gcode_macro _BTTEDDY_MACRO_PARAMS]
# max temp at which we should be calibrating the eddy
variable_calibration_max_temp: 40
gcode:

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
variable_scan_type: 'rapid_scan'
gcode:
    {% if printer["gcode_macro _SAF_BED_MESH_START"] != null %}
      _SAF_BED_MESH_START
    {% endif %}

    {% set start_print = (params.START_PRINT|default(0) == '1') %}
    {% if not start_print %}
      {% set max_velocity = printer.toolhead.max_velocity %}
      {% set max_accel = printer.toolhead.max_accel %}
      {% set square_corner_velocity = printer.toolhead.square_corner_velocity %}
      {% set start_max_velocity = [printer["gcode_macro _START_END_PARAMS"].start_max_velocity, max_velocity]|min %}
      {% set start_max_accel = [printer["gcode_macro _START_END_PARAMS"].start_max_accel, max_accel]|min %}
      {% set start_square_corner_velocity = [printer["gcode_macro _START_END_PARAMS"].start_square_corner_velocity, square_corner_velocity]|min %}
      {% if max_velocity > start_max_velocity or max_accel > start_max_accel or square_corner_velocity > start_square_corner_velocity %}
        RESPOND TYPE=command MSG='Setting VELOCITY={start_max_velocity} (was {max_velocity}) ACCEL={start_max_accel} (was {max_accel}) SQUARE_CORNER_VELOCITY={start_square_corner_velocity} (was {square_corner_velocity})'
        SET_VELOCITY_LIMIT VELOCITY={start_max_velocity} ACCEL={start_max_accel} SQUARE_CORNER_VELOCITY={start_square_corner_velocity}
      {% endif %}
    {% endif %}

    _BED_MESH_CALIBRATE METHOD={scan_type} {rawparams}

    {% if not start_print %}
      {% if max_velocity > start_max_velocity or max_accel > start_max_accel or square_corner_velocity > start_square_corner_velocity %}
        RESPOND TYPE=command MSG='Restoring VELOCITY={max_velocity} ACCEL={max_accel} SQUARE_CORNER_VELOCITY={square_corner_velocity}'
        SET_VELOCITY_LIMIT VELOCITY={max_velocity} ACCEL={max_accel} SQUARE_CORNER_VELOCITY={square_corner_velocity}
      {% endif %}
    {% endif %}

    {% if printer["gcode_macro _SAF_BED_MESH_END"] != null %}
      _SAF_BED_MESH_END
    {% endif %}


[gcode_macro BTTEDDY_CALIBRATE_DRIVE_CURRENT]
gcode:
    {% set calibration_max_temp = printer["gcode_macro _BTTEDDY_MACRO_PARAMS"].calibration_max_temp %}
    {% set position_max_x = printer.configfile.settings['stepper_x'].position_max %}
    {% set position_max_y = printer.configfile.settings['stepper_y'].position_max %}

    M104 S0
    M140 S0

    {% if "xy" not in printer.toolhead.homed_axes %}
      G28 X Y
    {% endif %}

    {% set eddy_temp = printer['temperature_sensor btt_eddy'].temperature %}
    {% if eddy_temp > calibration_max_temp %}
      G90
      G0 X{position_max_x - 25} Y{position_max_y / 2} F2800
      TURN_ON_FANS
      RESPOND TYPE=command MSG='Waiting for btt eddy to be less than {calibration_max_temp}c'
      TEMPERATURE_WAIT SENSOR="temperature_sensor btt_eddy" MAXIMUM={calibration_max_temp}

      TURN_OFF_FANS
      G0 X{position_max_x / 2} Y{position_max_y / 2} F2800
    {% endif %}

    LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy


[gcode_macro BTTEDDY_CURRENT_CALIBRATE]
variable_stop_start_camera: False
gcode:
    {% set calibration_max_temp = printer["gcode_macro _BTTEDDY_MACRO_PARAMS"].calibration_max_temp %}
    {% set position_max_x = printer.configfile.settings['stepper_x'].position_max %}
    {% set position_max_y = printer.configfile.settings['stepper_y'].position_max %}

    M104 S0
    M140 S0

    {% if "xy" not in printer.toolhead.homed_axes %}
      G28 X Y
    {% endif %}

    {% set max_z = printer.toolhead.axis_maximum.z - 5 %}
    RESPOND TYPE=command MSG='Setting fake Z Height of {max_z}'
    SET_KINEMATIC_POSITION Z={max_z}

    {% set eddy_temp = printer['temperature_sensor btt_eddy'].temperature %}
    {% if eddy_temp > calibration_max_temp %}
      G90
      G0 X{position_max_x - 25} Y{position_max_y / 2} F2800
      TURN_ON_FANS

      RESPOND TYPE=command MSG='Waiting for btt eddy to be less than {calibration_max_temp}c'
      TEMPERATURE_WAIT SENSOR="temperature_sensor btt_eddy" MAXIMUM={calibration_max_temp}

      TURN_OFF_FANS
      G0 X{position_max_x / 2} Y{position_max_y / 2} F2800
    {% endif %}

    {% if stop_start_camera %}
      STOP_CAMERA
    {% endif %}
    PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy

    {% if stop_start_camera %}
      RESPOND TYPE=command MSG='You need to run START_CAMERA on completion'
    {% endif %}


[gcode_macro loadcell_BTTEDDY_CALIBRATE_DRIVE_CURRENT]
gcode:
    # warn the tap is done cold
    RESPOND TYPE=command MSG='Make sure the nozzle is clean, no heat is used for the tap'
    # drive current calibration on/off
    {% set drive = params.DRIVE_CURRENT|default(1)|int %}
    # height klipper assumes before the tap, also the max tap travel
    {% set start_z = params.START_Z|default(25)|float %}
    # where the load cell taps
    {% set zero = printer.configfile.settings.bed_mesh.zero_reference_position %}

    # stop if no load cells
    {% if 'load_cell_probe' not in printer.configfile.settings %}
      {action_raise_error("Load cells are not set up")}
    {% endif %}

    # heaters off, eddy needs to be cool
    M104 S0
    M140 S0

    # home x and y if needed
    {% if "xy" not in printer.toolhead.homed_axes %}
      G28 X Y
    {% endif %}

    # absolute positioning
    G90
    # move to the tap position
    G1 X{zero[0]} Y{zero[1]} F6000
    # mark z homed at the start height
    SET_KINEMATIC_POSITION Z={start_z}
    # wait for moves to finish
    M400
    # let the load cells settle
    G4 P5000
    # tap and set z to 0 at contact
    LOAD_CELL_PROBE HOME=Z
    # move to the calibration height
    G0 Z20 F900

    # calibrate drive current
    {% if drive %}
      BTTEDDY_CALIBRATE_DRIVE_CURRENT
    {% endif %}


[gcode_macro loadcell_BTTEDDY_CURRENT_CALIBRATE]
variable_stop_start_camera: False
gcode:
    # warn the tap is done cold
    RESPOND TYPE=command MSG='Make sure the nozzle is clean, no heat is used for the tap'
    # height klipper assumes before the tap, also the max tap travel
    {% set start_z = params.START_Z|default(25)|float %}
    {% set calibration_max_temp = printer["gcode_macro _BTTEDDY_MACRO_PARAMS"].calibration_max_temp %}
    {% set position_max_x = printer.configfile.settings['stepper_x'].position_max %}
    {% set position_max_y = printer.configfile.settings['stepper_y'].position_max %}
    # where the load cell taps
    {% set zero = printer.configfile.settings.bed_mesh.zero_reference_position %}

    # stop if no load cells
    {% if 'load_cell_probe' not in printer.configfile.settings %}
      {action_raise_error("Load cells are not set up")}
    {% endif %}

    # heaters off, eddy needs to be cool
    M104 S0
    M140 S0

    # home x and y if needed
    {% if "xy" not in printer.toolhead.homed_axes %}
      G28 X Y
    {% endif %}

    {% set eddy_temp = printer['temperature_sensor btt_eddy'].temperature %}
    {% if eddy_temp > calibration_max_temp %}
      G90
      G0 X{position_max_x - 25} Y{position_max_y / 2} F2800
      TURN_ON_FANS

      RESPOND TYPE=command MSG='Waiting for btt eddy to be less than {calibration_max_temp}c'
      TEMPERATURE_WAIT SENSOR="temperature_sensor btt_eddy" MAXIMUM={calibration_max_temp}

      TURN_OFF_FANS
    {% endif %}

    # absolute positioning
    G90
    # move to the tap position
    G1 X{zero[0]} Y{zero[1]} F6000
    # mark z homed at the start height
    SET_KINEMATIC_POSITION Z={start_z}
    # wait for moves to finish
    M400
    # let the load cells settle
    G4 P5000
    # tap and set z to 0 at contact
    LOAD_CELL_PROBE HOME=Z
    # raise so the manual probe starts above the bed
    G0 Z5 F900

    {% if stop_start_camera %}
      STOP_CAMERA
    {% endif %}
    # then run TESTZ Z=-4.9 and ACCEPT
    PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy

    {% if stop_start_camera %}
      RESPOND TYPE=command MSG='You need to run START_CAMERA on completion'
    {% endif %}
