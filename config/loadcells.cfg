[load_cell_probe]
sensor_type: hx711s
# dout_pins/sclk_pins vary by printer -- set in the mount override file
sensor_orientation: inverted
sample_rate: 80
gain: A-128

# counts_per_gram and reference_tare_counts are deliberately left unset --
# both default to None, which keeps the probe in an uncalibrated state
# until LOAD_CELL_CALIBRATE is run. One shared counts_per_gram covers all
# 4 summed channels, not four independent per-corner fits.

# trigger_force has a hard maxval of 250 (load_cell_probe.py's own
# intParamHelper) -- this is the module's own built-in default, re-tune with
# LOAD_CELL_TEST_TAP once real hardware data exists
trigger_force: 75
force_safety_limit: 2000
drift_safety_limit: 1000

# speed/lift_speed/pullback_speed/sample_retract_dist depend on kinematics
# (cartesian/CoreXY/CoreXZ have different safe Z-axis dynamics) -- set in
# the mount override file
speed: 999
lift_speed: 999
z_offset: 999
# pullback_distance is deliberately left unset -- LOAD_CELL_PROBE_CALIBRATE
# CALIBRATION=PULLBACK_DISTANCE measures the real value, nothing to guess
pullback_speed: 999
sample_retract_dist: 999
samples_tolerance: 0.05
samples_tolerance_retries: 3
# module default -- OpenCentauri's own docs/configs never override this.
# tap_quality stays inert (no scoring) until decompression_angle is
# calibrated, so this is the real, documented safe-starting-point path.
tap_classifier: tap_quality

[bed_mesh]
# OpenCentauri's real values (machine.cfg) -- fade left at module default
# (disabled) since OpenCentauri never overrides it either
speed: 150
mesh_min: 999,999
mesh_max: 999,999
horizontal_move_z: 999
probe_count: 4,4
mesh_pps: 3,3
algorithm: bicubic
adaptive_margin: 3
move_check_distance: 3.0
split_delta_z: 0.01
horizontal_z_clearance: 999

[screws_tilt_adjust]
screw1: 999,999
screw1_name: front left screw
screw2: 999,999
screw2_name: front right screw
screw3: 999,999
screw3_name: rear right screw
screw4: 999,999
screw4_name: rear left screw
speed: 50
horizontal_move_z: 5
screw_thread: CW-M4

[axis_twist_compensation]
speed: 50
horizontal_move_z: 5
calibrate_start_x: 999
calibrate_end_x: 999
calibrate_y: 999
