[gcode_shell_command camera-control]
command: /usr/data/pellcorp/k1/tools/camera-control.sh
timeout: 30.0
verbose: True

[gcode_macro CAMERA_CONTROL]
description: CONTROL=<name> VALUE=<value|default>, no CONTROL lists available controls
gcode:
    {% set control = params.CONTROL|default('') %}
    {% set value = params.VALUE|default('') %}
    {% if control %}
      RUN_SHELL_COMMAND CMD=camera-control PARAMS="CONTROL={control} VALUE={value}"
    {% else %}
      RUN_SHELL_COMMAND CMD=camera-control
    {% endif %}

# controls set via CAMERA_CONTROL are saved here and re-applied by S50webcam on startup
[gcode_macro _CAMERA_CONTROL_SAVED]
variable_controls: 'none'
gcode:
