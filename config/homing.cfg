[gcode_macro _HOMING_PARAMS]
variable_homing_current: 1.5
variable_safe_z: 3
# force move for homing after M84 or power off
variable_force_move: True
# stop and start the camera when homing Z
variable_stop_start_camera: False
# these are only relevant for sensorless homing
variable_homing_move_away_y: 10
variable_homing_move_away_x: 10
# this configures the z-hop done after z homing and applies regardless of sensorless or not
variable_homing_move_away_z: 10
# some people don't like double homing ignored if not using sensorless
variable_repeat_home_xy: False
# some printers need to home y before x
variable_home_y_before_x: False
# for printers whose X endstop needs Y at max to be reachable (e.g. Ender 5 Max,
# where X and Y endstops share the rear-right corner). Opt-in / default off: on
# Kalico the post-home retract leaves Y short of the corner so X misses its switch;
# enable this to push Y back to max before homing X.
variable_return_y_to_max_before_x: False
# corexz only, some printers can only reach the x endstop once z is homed (e.g. Ender 3 V3)
# do not set if using a probe to home z
variable_home_z_before_x: False
# make sure the x and z endstops released after homing (e.g. Ender 3 V3 endstops are wired NC)
# do not set if z homes to max where the x endstop is, as z will still be on its endstop
variable_check_xz_endstops_clear: False
# coordinates that the _POST_HOME_XY will position the nozzle before homing z (sensorless/no coupled endstop) or homing y (xz coupled end stops)
variable_home_x: 150
variable_home_y: 150
# if you are rocking other than TMC 2209 drivers should configure it here
variable_driver_type: "tmc2209"
gcode:

[force_move]
enable_force_move: true

# disable force move macro because it should not be used only SET_KINEMATIC_POSITION
[gcode_macro FORCE_MOVE]
rename_existing: _FORCE_MOVE_BAD
variable_disable_force_move: True
gcode:
  {% if disable_force_move %}
    RESPOND TYPE=command MSG="Use SET_KINEMATIC_POSITION instead of FORCE_MOVE"
  {% else %}
    _FORCE_MOVE_BAD {rawparams}
  {% endif %}


# used with check_xz_endstops_clear, make sure the x and z endstops released after homing
[gcode_macro _CHECK_XZ_ENDSTOPS_CLEAR]
description: throw if X or Z endstop is triggered
gcode:
  {% if (printer.query_endstops.last_query["x"]
      or printer.query_endstops.last_query["z"]) %}
    {action_raise_error("X/Z endstop should not be triggered")}
  {% endif %}


[homing_override]
axes: xyz
gcode:
    {% set uparams = rawparams | upper %}
    {% set home_x = 'X' in uparams %}
    {% set home_y = 'Y' in uparams %}
    {% set home_z = 'Z' in uparams %}
    {% set home_all = (home_x and home_y and home_z) or (not home_x and not home_y and not home_z) %}
    {% set klicky = (printer["gcode_macro _KLICKY_VARIABLES"] != null) %}

    {% set sensorless_homing = ('virtual_endstop' in printer.configfile.settings['stepper_x'].endstop_pin and 'virtual_endstop' in printer.configfile.settings['stepper_y'].endstop_pin) %}
    {% set repeat_home_xy = printer["gcode_macro _HOMING_PARAMS"].repeat_home_xy %}
    # x and z share the same motors, so z homes first whenever x is requested
    {% set home_z_first = printer["gcode_macro _HOMING_PARAMS"].home_z_before_x and (home_all or home_x or home_z) %}
    # x can only be homed again while z is still at its endstop
    {% set home_count = 2 if sensorless_homing and repeat_home_xy and not home_z_first else 1 %}
    {% set home_y_before_x = printer["gcode_macro _HOMING_PARAMS"].home_y_before_x %}
    {% set home_axes_order = ['y', 'x'] if home_y_before_x else ['x', 'y'] %}

    {% if printer["gcode_macro _SAF_HOMING_START"] != null %}
      _SAF_HOMING_START
    {% endif %}

    G90

    {% if home_z_first %}
      # z stays at its endstop until x is homed
      _HOME_Z POST=0
    {% elif home_all or home_x or home_y %}
    # consistent with beacon set the variable
     SET_GCODE_VARIABLE MACRO=_PRE_HOME_XY VARIABLE=home_all VALUE={home_all}
      _PRE_HOME_XY
    {% endif %}

    {% for repeat in range(0,home_count) %}
      {% for axes in home_axes_order %}
        {% if axes == 'x' and (home_all or home_x) %}
          _PRE_HOME_X
          G28 X
          _POST_HOME_X
          {% if home_z_first %}
            # x and z share motors so move both in one go
            _POST_HOME_Z X={printer["gcode_macro _HOMING_PARAMS"].home_x|int}
          {% endif %}
        {% elif axes == 'y' and (home_all or home_y) %}
          _PRE_HOME_Y
          G28 Y
          _POST_HOME_Y
        {% endif %}
      {% endfor %}
    {% endfor %}

    {% if home_z_first and not (home_all or home_x) %}
      _POST_HOME_Z
    {% endif %}

    # do not want post home centering for klicky as we need to attach probe first
    {% if (not klicky or not home_z) and (home_all or (home_x and home_y)) %}
      _POST_HOME_XY
    {% endif %}

    {% if (home_all or home_z) and not home_z_first %}
      _HOME_Z
    {% endif %}

    {% if printer["gcode_macro _HOMING_PARAMS"].check_xz_endstops_clear and (home_all or home_x or home_z) %}
      QUERY_ENDSTOPS
      _CHECK_XZ_ENDSTOPS_CLEAR
    {% endif %}

    {% if printer["gcode_macro _SAF_HOMING_END"] != null %}
      _SAF_HOMING_END
    {% endif %}


[gcode_macro _HOME_Z]
gcode:
  {% set post = params.POST|default(1)|int %}

  # check if MCU is connected before trying to home Z
  {% if printer["mcu scanner"] != null and printer["mcu scanner"].non_critical_disconnected|default(False) %}
    RESPOND TYPE=error MSG='Cartographer is not connected, aborting homing Z!'
    SET_KINEMATIC_POSITION CLEAR=Z
  {% elif printer["mcu cartographer"] != null and printer["mcu cartographer"].non_critical_disconnected|default(False) %}
    RESPOND TYPE=error MSG='Cartographer is not connected, aborting homing Z!'
    SET_KINEMATIC_POSITION CLEAR=Z
  {% elif printer["mcu eddy"] != null and printer["mcu eddy"].non_critical_disconnected|default(False) %}
    RESPOND TYPE=error MSG='Eddy is not connected, aborting homing Z!'
    SET_KINEMATIC_POSITION CLEAR=Z
  {% elif ('load_cell_probe' in printer.configfile.settings) and printer.load_cell_probe.counts_per_gram is none %}
    RESPOND TYPE=error MSG='Load Cells are not calibrated, aborting homing Z!'
    SET_KINEMATIC_POSITION CLEAR=Z
  {% else %}
    _PRE_HOME_Z
    G28 Z
    {% if post %}
      _POST_HOME_Z
    {% endif %}
  {% endif %}


# for corexz the x and z steppers drive x together and y is the bed
[gcode_macro _PRE_HOME_X]
gcode:
  {% set sensorless_homing = ('virtual_endstop' in printer.configfile.settings['stepper_x'].endstop_pin) %}
  {% if sensorless_homing %}
    {% set corexz = printer.configfile.settings.printer.kinematics == 'corexz' %}
    {% set HOMING_CURRENT = printer["gcode_macro _HOMING_PARAMS"].homing_current %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOMING_CURRENT}
    SET_TMC_CURRENT STEPPER={'stepper_z' if corexz else 'stepper_y'} CURRENT={HOMING_CURRENT}
  {% endif %}
  {% if printer["gcode_macro _HOMING_PARAMS"].return_y_to_max_before_x and 'y' in printer.toolhead.homed_axes %}
    # X endstop shares a corner with Y (e.g. Ender 5 Max): X only reaches its
    # switch with Y at max, but the home retract leaves Y short -> put it back.
    G90
    G1 Y{printer.configfile.settings['stepper_y'].position_max} F9000
  {% endif %}


[gcode_macro _PRE_HOME_Y]
gcode:
  {% set sensorless_homing = ('virtual_endstop' in printer.configfile.settings['stepper_y'].endstop_pin) %}
  {% if sensorless_homing %}
    {% set corexz = printer.configfile.settings.printer.kinematics == 'corexz' %}
    {% set HOMING_CURRENT = printer["gcode_macro _HOMING_PARAMS"].homing_current %}
    {% if not corexz %}
      SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOMING_CURRENT}
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOMING_CURRENT}
  {% endif %}


[gcode_macro _PRE_HOME_Z]
# cached value of camera started when homing Z, used in _PRE_HOME_Z and _POST_HOME_Z
variable_camera_started: True
gcode:
  {% set camera_started = printer["gcode_macro START_CAMERA"].started|default(true) %}
  SET_GCODE_VARIABLE MACRO=_PRE_HOME_Z VARIABLE=camera_started VALUE={camera_started}
  {% set stop_start_camera = printer["gcode_macro _HOMING_PARAMS"].stop_start_camera %}
  {% set klicky = (printer["gcode_macro _KLICKY_VARIABLES"] != null) %}

  {% if stop_start_camera and camera_started %}
    STOP_CAMERA
  {% endif %}

  {% if klicky %}
    ATTACH_PROBE MANUAL=0
  {% elif printer['output_pin _saf_z_endstop'] != null %}
    {% set home_x = printer["gcode_macro _HOMING_PARAMS"].home_x|int %}
    {% set home_y = printer["gcode_macro _HOMING_PARAMS"].home_y|int %}
    G90
    G0 X{home_x} Y{home_y} F15000
    SET_PIN PIN=_saf_z_endstop VALUE=1
  {% endif %}

[gcode_macro _POST_HOME_X]
gcode:
    {% set sensorless_homing = ('virtual_endstop' in printer.configfile.settings['stepper_x'].endstop_pin) %}
    {% if sensorless_homing %}
      {% set homing_move_away_x = printer["gcode_macro _HOMING_PARAMS"].homing_move_away_x %}
      {% set x_position_endstop = printer.configfile.settings['stepper_x'].position_endstop %}
      {% set x_position_min = printer.configfile.settings['stepper_x'].position_min %}
      {% set x_position_max = printer.configfile.settings['stepper_x'].position_max %}
      G91
      {% if (x_position_endstop - x_position_min) > (x_position_max - x_position_endstop) %}
        G1 X-{homing_move_away_x } F1200
      {% else %}
        G1 X+{homing_move_away_x } F1200
      {% endif %}

      {% set driver = printer["gcode_macro _HOMING_PARAMS"].driver_type %}
      {% set corexz = printer.configfile.settings.printer.kinematics == 'corexz' %}
      {% set RUN_CURRENT_X = printer.configfile.settings[driver ~ ' stepper_x'].run_current|float %}
      {% set RUN_CURRENT_YZ = printer.configfile.settings[driver ~ (' stepper_z' if corexz else ' stepper_y')].run_current|float %}

      # Wait just a second… (give StallGuard registers time to clear)
      G4 P1000
      SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
      SET_TMC_CURRENT STEPPER={'stepper_z' if corexz else 'stepper_y'} CURRENT={RUN_CURRENT_YZ}
    {% endif %}


[gcode_macro _POST_HOME_Y]
gcode:
    {% set sensorless_homing = ('virtual_endstop' in printer.configfile.settings['stepper_y'].endstop_pin) %}
    {% if sensorless_homing %}
      {% set homing_move_away_y = printer["gcode_macro _HOMING_PARAMS"].homing_move_away_y %}
      {% set y_position_endstop = printer.configfile.settings['stepper_y'].position_endstop %}
      {% set y_position_min = printer.configfile.settings['stepper_y'].position_min %}
      {% set y_position_max = printer.configfile.settings['stepper_y'].position_max %}
      G91
      {% if (y_position_endstop - y_position_min) > (y_position_max - y_position_endstop) %}
        G1 Y-{homing_move_away_y } F1200
      {% else %}
        G1 Y+{homing_move_away_y} F1200
      {% endif %}

      {% set driver = printer["gcode_macro _HOMING_PARAMS"].driver_type %}
      {% set corexz = printer.configfile.settings.printer.kinematics == 'corexz' %}
      {% set RUN_CURRENT_X = printer.configfile.settings[driver ~ ' stepper_x'].run_current|float %}
      {% set RUN_CURRENT_Y = printer.configfile.settings[driver ~ ' stepper_y'].run_current|float %}

      # Wait just a second… (give StallGuard registers time to clear)
      G4 P1000
      {% if not corexz %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
      {% endif %}
      SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    {% endif %}


[gcode_macro _POST_HOME_Z]
gcode:
  {% set camera_started = printer["gcode_macro _PRE_HOME_Z"].camera_started|default(true) %}
  {% set stop_start_camera = printer["gcode_macro _HOMING_PARAMS"].stop_start_camera %}
  {% set klicky = (printer["gcode_macro _KLICKY_VARIABLES"] != null) %}
  {% set homing_move_away_z = printer["gcode_macro _HOMING_PARAMS"].homing_move_away_z|int %}

  {% if stop_start_camera and camera_started %}
    START_CAMERA
  {% endif %}

  # little z-hop at the end
  G90
  {% if params.X is defined %}
    G1 X{params.X} Z{homing_move_away_z} F3200
  {% else %}
    G1 Z{homing_move_away_z} F1200
  {% endif %}

  {% if klicky %}
    DOCK_PROBE MANUAL=0
  {% elif printer['output_pin _saf_z_endstop'] != null %}
    SET_PIN PIN=_saf_z_endstop VALUE=0
  {% endif %}


[gcode_macro _PRE_HOME_XY]
variable_home_all: True
gcode:
    # where motors were turned off or printer power cycled / klipper restarted
    # so if at least one axis has been homed printer.toolhead.homed_axes = "xyz"
    # so this safe force move step only occurs when no axis are homed
    {% set force_move = printer["gcode_macro _HOMING_PARAMS"].force_move %}
    {% set safe_z = printer["gcode_macro _HOMING_PARAMS"].safe_z|int %}

    {% if printer.toolhead.homed_axes != "xyz" and force_move %}
        RESPOND TYPE=command MSG='Force moving Z {safe_z} mm distance'
        SET_KINEMATIC_POSITION Z=0
        G0 Z{safe_z} F600
        # wait for motor move to finish
        M400

        {% if not home_all %}
          SET_KINEMATIC_POSITION CLEAR=Z
        {% endif %}
    {% endif %}


[gcode_macro _POST_HOME_XY]
gcode:
    {% set home_x = printer["gcode_macro _HOMING_PARAMS"].home_x|int %}
    {% set home_y = printer["gcode_macro _HOMING_PARAMS"].home_y|int %}
    {% if "xy" in printer.toolhead.homed_axes %}
        G90

        G0 X{home_x} Y{home_y} F3200
    {% elif "x" in printer.toolhead.homed_axes %}
        # xz coupled endstops, y is not homed yet
        G90

        G0 X{home_x} F3200
    {% endif %}
