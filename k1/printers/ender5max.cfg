# Simple AF Base Printer (F004)
# CR-10 SE
[mcu]
serial:/dev/ttyS1
baud:230400
restart_method: command

[force_move]
enable_force_move: True
[mcu nozzle_mcu]
serial:/dev/ttyS7
baud: 230400
restart_method: command

[mcu leveling_mcu]
serial: /dev/ttyS6
baud: 230400
restart_method: command

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 100000
max_z_velocity: 30
square_corner_velocity: 5.0
max_z_accel: 300

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 63.874
endstop_pin: !PA11
position_endstop: 400.5
position_min: -5
position_max: 406
homing_speed: 40
homing_retract_dist:0

[tmc2209 stepper_x]
uart_pin:PB12
driver_SGTHRS: 80
uart_address:3 
interpolate: True
run_current: 2.0
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: ^PB10

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 64.024
endstop_pin: !PA12
position_endstop: 401
position_min: -1
position_max: 401
homing_speed: 40
homing_retract_dist:0

[tmc2209 stepper_y]
uart_pin:PB13
driver_SGTHRS: 80
uart_address:3 
interpolate: True
run_current: 2.0
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: ^PB11

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PC3
microsteps: 32
rotation_distance: 3.9930
gear_ratio: 1:1
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_max: 406.5
position_min: -5

[tmc2209 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
uart_address:3 
stealthchop_threshold: 0
sense_resistor: 0.150
diag_pin: PB0

[filament_switch_sensor filament_sensor]
switch_pin: !PC6
pause_on_runout: true

[output_pin Height_module2]
pin: PA7
value: 1.0

[extruder]
max_extrude_only_distance:1000
max_extrude_cross_section:80
pressure_advance: 0.04
step_pin: nozzle_mcu: PB5
dir_pin: nozzle_mcu: PB4
enable_pin: !nozzle_mcu: PB2
microsteps: 16
rotation_distance: 6.72
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu: PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu: PA0
control: pid
pid_kp: 20.145
pid_ki: 1.919 
pid_kd: 52.881
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu: PB10
run_current: 0.6
sense_resistor: 0.15
stealthchop_threshold: 0
uart_address:3 

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 50
probe_points: 200,200,10

[heater_bed]
heater_pin: PA4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 30
pid_ki: 0.075
pid_kd: 800
min_temp: -30
max_temp: 130

[output_pin green_pin]
pin: PA0
value: 0.0
[output_pin red_pin]
pin: PC1
value: 0.0
[output_pin yellow_pin]
pin: PA1
value: 1.0
[output_pin light_pin]
pin: PC0
value: 0.0

[adxl345]
cs_pin: nozzle_mcu:PA4
axes_map: x,-z,y
spi_speed: 5000000
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[duplicate_pin_override]
pins: PC0, PC5

[fan]
pin: !nozzle_mcu: PB8
enable_pin: nozzle_mcu:PB6
cycle_time: 0.0100
hardware_pwm: false
# this is a feature of Simple AF klipper to support P argument
# and the mapping is P1=chamber, P2=auxiliary, P3=chamber
p_selector_map: chamber, auxiliary, chamber

[fan_generic chamber]
pin: PC0
cycle_time: 0.0100
hardware_pwm: false

[fan_generic auxiliary]
pin: PB1
# fixes throttling aux fan below 80% thanks to ClutchKick512
cycle_time: 0.002
hardware_pwm: false

# this has the nozzle mcu fan only on when the extruder is at last 40c
[heater_fan hotend]
pin: nozzle_mcu:PB5
tachometer_pin: ^nozzle_mcu:PB4
heater: extruder
heater_temp: 40

# this forces the nozzle mcu to always be on
#[static_digital_output nozzle_mcu_fan_always_on]

# this makes sure that the MCU fan is always on
[static_digital_output mcu_fan_always_on]
pins:PB2

# you can change the fan from always on to just on when the extruder, bed or steppers
# are on, but this will mean the MCU fan might be off when you are doing other activities
# that are very CPU intensive, like generating graphs
#[controller_fan mcu]

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor nozzle_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu
min_temp: 0
max_temp: 100

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 125

# this is used to turn the chamber fan on at a certain temp
# it is separate from the chamber fan above we control via M106
[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0

