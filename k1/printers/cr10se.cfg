# Simple AF Base Printer (F003)
# CR-10 SE
[mcu]
serial:/dev/ttyS1
baud:230400
restart_method: command

[force_move]
enable_force_move: True
[mcu nozzle_mcu]
serial:/dev/ttyS7
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 600
max_accel: 8000
max_z_velocity: 30
square_corner_velocity: 5.0
max_z_accel: 300

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -10.5
position_min: -10.5
position_max: 243
homing_speed: 20
homing_retract_dist:0

[tmc2209 stepper_x]
uart_pin:PB12
driver_SGTHRS: 78
uart_address:3 
interpolate: True
run_current:0.65
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: ^PB10

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 60
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -5.5
position_min: -5.5
position_max: 225
homing_speed: 30
homing_retract_dist:0

[tmc2209 stepper_y]
uart_pin:PB13
driver_SGTHRS: 75
uart_address:3 
interpolate: True
driver_HSTRT: 6
driver_HEND: 0
run_current: 0.6
sense_resistor: 0.150
stealthchop_threshold: 0
diag_pin: ^PB11

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 32
rotation_distance:8
endstop_pin: probe:z_virtual_endstop
position_max: 270
position_min: -5

[tmc2209 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
uart_address:3 
stealthchop_threshold: 0
sense_resistor: 0.150

[filament_switch_sensor filament_sensor]
switch_pin: !PC6
pause_on_runout: true

[extruder]
max_extrude_only_distance:1000
max_extrude_cross_section:80
pressure_advance: 0.04
step_pin: nozzle_mcu: PB5
dir_pin: !nozzle_mcu: PB4
enable_pin: !nozzle_mcu: PB2
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu: PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu: PA0
control: pid
pid_kp: 20.145
pid_ki: 1.919 
pid_kd: 52.881

min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu: PB10
run_current: 0.7
sense_resistor: 0.15
stealthchop_threshold: 0
uart_address:3 

[adxl345 x]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: z,-x,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[adxl345 y]
cs_pin: rpi:None
spi_speed: 2000000
spi_bus: spidev2.0

[resonance_tester]
accel_chip_x: adxl345 x
accel_chip_y: adxl345 y
accel_per_hz: 50
probe_points:110,110,5
max_freq:90

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F 
sensor_pin: PC4
control: pid
pid_kp: 70.652
pid_ki: 1.798
pid_kd: 694.157
min_temp: 0
max_temp: 130

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[duplicate_pin_override]
pins: PC0, PC5

[fan]
pin: !nozzle_mcu: PB8
enable_pin: nozzle_mcu:PB6
cycle_time: 0.0100
hardware_pwm: false
# this is a feature of Simple AF klipper to support P argument
# and the mapping is P1=chamber, P2=auxiliary, P3=chamber
p_selector_map: chamber, auxiliary, chamber

[fan_generic chamber]
pin: PC0
cycle_time: 0.0100
hardware_pwm: false

[fan_generic auxiliary]
pin: PB1
# fixes throttling aux fan below 80% thanks to ClutchKick512
cycle_time: 0.002
hardware_pwm: false

# this has the nozzle mcu fan only on when the extruder is at last 40c
[heater_fan hotend]
pin: nozzle_mcu:PB5
tachometer_pin: ^nozzle_mcu:PB4
heater: extruder
heater_temp: 40

# this forces the nozzle mcu to always be on
#[static_digital_output nozzle_mcu_fan_always_on]

# this makes sure that the MCU fan is always on
[static_digital_output mcu_fan_always_on]
pins:PB2

# you can change the fan from always on to just on when the extruder, bed or steppers
# are on, but this will mean the MCU fan might be off when you are doing other activities
# that are very CPU intensive, like generating graphs
#[controller_fan mcu]

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor nozzle_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu
min_temp: 0
max_temp: 100

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 125

# this is used to turn the chamber fan on at a certain temp
# it is separate from the chamber fan above we control via M106
[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0

