# this is temporary homing cfg for Ender 3 V3 just to see if we got the basics
# working or a long way off

[force_move]
  enable_force_move: true

# XZ endstops are wired NC, so make sure they deactivate
[gcode_macro CHECK_XZ_ENDSTOPS_CLEAR]
description: throw if X or Z endstop is triggered
gcode:
  {% if (printer.query_endstops.last_query["x"]
      or printer.query_endstops.last_query["z"]) %}
    {action_raise_error("X/Z endstop should not be triggered")}
  {% endif %}

# X and Z use real physical endstops -- retract-and-reapproach at a slower
# speed for a more precise, repeatable trigger point (standard Klipper
# double-tap homing, not sensorless-specific)
[stepper_x]
homing_retract_dist: 10
second_homing_speed: 10

[stepper_z]
homing_retract_dist: 10
second_homing_speed: 5

# Y is the only sensorless (StallGuard virtual_endstop) axis on this printer --
# drop TMC current before the stall-detection move and restore it after, same
# pattern Creality's own stock _HOME_Y had commented out (HOME_CUR = 0.500)
[gcode_macro _PRE_HOME_Y]
gcode:
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.500

[gcode_macro _POST_HOME_Y]
gcode:
  # give StallGuard registers time to clear before restoring current
  G4 P1000
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.500

[homing_override]
axes: xyz
gcode:
  {%set SPEED = 60 * 60 %}  ; movement speed mm/m
  {%set XZ_RETRACT = 10 %}  ; retract from endstops mm

  {%set PARK_X = 110 %}     ; parking positions
  {%set PARK_Y = 110 %}
  {%set PARK_Z = 20 %}

  M220 S100
  SET_VELOCITY_LIMIT ACCEL=5000
  BED_MESH_CLEAR

  # Home ZX
  G28 Z
  G28 X

  # Retract from endstops
  G91
  G1 X{XZ_RETRACT} Z-{XZ_RETRACT} F{SPEED}
  M400
  G90

  # Check that endstops deactivate
  QUERY_ENDSTOPS
  CHECK_XZ_ENDSTOPS_CLEAR

  # Park tool head
  G1 Z{PARK_Z} X{PARK_X} F{SPEED}
  M400
  G4 P500

  # Home Y
  _PRE_HOME_Y
  G28 Y
  _POST_HOME_Y

  # Park Y
  G1 Y{PARK_Y} F{SPEED}
  M400
  G4 P500
