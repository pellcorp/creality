# Ender 3 V3 SE
# MODEL:e3v3se

-- printer.cfg
[mcu]
serial:/dev/ttyS1
baud:230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2500
max_z_velocity: 100
max_z_accel: 500
square_corner_velocity: 5.0

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -11
position_min: -15
position_max: 224
homing_speed: 40

[tmc2208 stepper_x]
uart_pin:PB12
interpolate: True
run_current:0.80
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 220
homing_speed: 40

[tmc2208 stepper_y]
uart_pin:PB13
interpolate: True
run_current:0.80
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance:8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.80
sense_resistor: 0.150
stealthchop_threshold: 0

[extruder]
max_extrude_only_distance:1000
max_extrude_cross_section:80
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
control = pid
pid_Kp=20.584
pid_Ki=1.737
pid_Kd=60.981
min_temp: 0
max_temp: 320

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control = pid
pid_kp = 70.652
pid_ki = 1.798
pid_kd = 694.157
min_temp: 0
max_temp: 130

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[fan]
pin:PA0
cycle_time: 0.0100
hardware_pwm: false

[heater_fan hotend]
pin: PC1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

# this makes sure that the MCU fan is always on
[static_digital_output mcu_fan_always_on]
pins: PB1

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_speed: 2000000
spi_bus: spidev2.0
axes_map: z,y,x

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 70
probe_points: 112,110,100
max_freq: 90

[filament_switch_sensor filament_sensor]
pause_on_runout: True
switch_pin: !PC15

-- bltouch.cfg
[bltouch]
sensor_pin: ^PC14
control_pin: PC13
